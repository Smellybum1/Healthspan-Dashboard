name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  quality:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm db:doctor
      - run: pnpm personalisation:doctor
      - run: pnpm alerts:doctor
      - run: pnpm briefs:doctor
      - run: pnpm backup:doctor
      - run: pnpm operations:doctor
      - run: pnpm secrets:scan
      - run: pnpm sbom
        continue-on-error: true
